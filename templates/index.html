<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>SpaceMusededu47 - กำลังโหลด...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #fafafa; font-family: sans-serif; color: #888; }
    </style>
</head>
<body>
    <div>กำลังตรวจสอบสถานะการเข้าสู่ระบบ...</div>
    <script>
        let user = JSON.parse(localStorage.getItem('user')) || null;
        window.onload = () => {
            if (user) {
                if (user.phone && user.phone.trim() !== "") {
                    window.location.href = '/login/service';
                } else {
                    window.location.href = '/login/profile';
                }
            } else {
                window.location.href = '/login';
            }
        };
    </script>
</body>
</html>
