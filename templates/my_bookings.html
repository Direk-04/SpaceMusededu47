<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>การจองของฉัน - SpaceMusededu47</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="my-bookings-page" class="auth-container">
        <div style="width: 100%; max-width: 700px;">
            <div style="margin-bottom: 30px; text-align: left;">
                <button onclick="window.history.back()" class="btn-nav-back"><i class="fas fa-arrow-left"></i> กลับ</button>
            </div>
            <div class="premium-card" style="padding: 40px;">
                <h2 style="margin-top: 0;"><i class="fas fa-calendar-check" style="color: var(--primary);"></i> การจองของฉัน</h2>
                <div id="my-bookings-list" style="margin-top: 20px;"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        let user = JSON.parse(localStorage.getItem('user')) || null;
        window.onload = () => {
            if (!user) { window.location.href = '/login'; return; }
            showMyBookings();
        };

        async function showMyBookings() {
            if (!user || !user.student_id) return;
            const container = document.getElementById('my-bookings-list');
            container.innerHTML = '<div style="text-align:center; padding:30px; color:#bbb;"><i class="fas fa-circle-notch fa-spin fa-2x"></i> กำลังโหลด...</div>';
            try {
                const res = await fetch(`/my_bookings_api?student_id=${encodeURIComponent(user.student_id.trim())}`);
                const bookings = await res.json();
                container.innerHTML = bookings.length === 0 ? '<p style="text-align:center; color:#888; padding:30px;">ไม่มีรายการจอง</p>' : '';
                bookings.forEach(b => {
                    const item = document.createElement('div');
                    item.style = 'background:white; padding:20px; border-radius:20px; margin-bottom:15px; border:1px solid #eee; display:flex; justify-content:space-between; align-items:center;';
                    item.innerHTML = `
                        <div style="text-align:left;">
                            <h4 style="margin:0; font-size:1.2em; color:var(--primary);">${b.room_name}</h4>
                            <div style="color:#333; font-weight:600; font-size:0.95em; margin-top:3px;"><i class="far fa-calendar-alt"></i> ${b.date} | ${b.start} - ${b.end}</div>
                            <div style="color:#888; font-size:0.85em; margin-top:5px;"><strong>จุดประสงค์:</strong> ${b.purpose || '-'}</div>
                            ${b.teacher ? `<div style="color:#ff8c00; font-size:0.85em; margin-top:3px; font-weight:600;"><i class="fas fa-chalkboard-teacher"></i> อาจารย์ผู้รับผิดชอบ: ${b.teacher}</div>` : ''}
                        </div>
                        <button onclick="cancelBooking(${b.booking_id})" style="background:#fff0f0; color:#ff4d4d; border:none; padding:10px 20px; border-radius:15px; font-weight:800; cursor:pointer;">ยกเลิก</button>
                    `;
                    container.appendChild(item);
                });
            } catch (err) { container.innerHTML = '<p style="text-align:center; color:red; padding:30px;">เกิดข้อผิดพลาด</p>'; }
        }

        async function cancelBooking(id) {
            const res = await Swal.fire({ title: 'ยืนยันยกเลิก?', text: 'ไม่สามารถย้อนกลับได้', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ff4d4d', confirmButtonText: 'ยืนยัน' });
            if (res.isConfirmed) {
                const r = await fetch('/cancel_booking', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ booking_id: id }) });
                const d = await r.json();
                Swal.fire(d.status === 'success' ? 'สำเร็จ' : 'ผิดพลาด', d.message, d.status);
                showMyBookings();
            }
        }
    </script>
</body>
</html>
